# Public entry for testing by link (port PUBLIC_PORT, default 8031; the Cloudflare tunnel points here).
# Only the scanner, recognition, sommelier and read-only catalog routes are passed to the API.
# Everything that changes the catalog (/add, /import, POST /api/products, /api/imports) stays on the
# private port 8030 of this computer.

server {
    listen 8031;
    server_name _;

    client_max_body_size 25m;
    proxy_read_timeout 120s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    location = / {
        return 302 /mobi/;
    }

    # Scanner pages and static files
    location /mobi/ {
        limit_except GET { deny all; }
        proxy_pass http://api:8030;
    }
    location = /mobi/add.html {
        return 403;
    }
    location /export/ {
        limit_except GET { deny all; }
        proxy_pass http://api:8030;
    }
    location /static/ {
        limit_except GET { deny all; }
        proxy_pass http://api:8030;
    }
    location = /search-cascade {
        limit_except GET { deny all; }
        proxy_pass http://api:8030;
    }
    location = /products {
        limit_except GET { deny all; }
        proxy_pass http://api:8030;
    }
    location /products/ {
        limit_except GET { deny all; }
        proxy_pass http://api:8030;
    }

    # Recognition and sommelier
    location /api/cascade/ {
        proxy_pass http://api:8030;
    }
    location /api/sommelier/ {
        proxy_pass http://api:8030;
    }

    # Read-only catalog, media and test photo lists used by /search-cascade
    location /api/media/ {
        limit_except GET { deny all; }
        proxy_pass http://api:8030;
    }
    location /api/products {
        limit_except GET { deny all; }
        proxy_pass http://api:8030;
    }
    location /api/rectify/ {
        limit_except GET { deny all; }
        proxy_pass http://api:8030;
    }

    # Health and API documentation
    location ~ ^/api/(ping|ready|docs|openapi\.json)$ {
        limit_except GET { deny all; }
        proxy_pass http://api:8030;
    }

    location / {
        return 403;
    }
}
