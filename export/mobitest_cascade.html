<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>mobitest cascade (v1 + v4) — LCT2026</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <link rel="stylesheet" href="style.css?v=5">
  <style>
    .camera-container { position: relative; display: inline-block; width: 100%; overflow: hidden; border-radius: 8px; }
    #camera-video { width: 100%; display: block; background: #000; transition: filter 0.3s ease; }
    #freeze-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transition: filter 0.3s ease; }
    #freeze-canvas.hidden { display: none; }
    #overlay-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: opacity 0.3s ease; }
    
    /* Paused / blurred camera state */
    .camera-container.paused #camera-video,
    .camera-container.paused #freeze-canvas {
      filter: blur(10px) brightness(0.6);
    }
    .camera-container.paused #overlay-canvas {
      opacity: 0;
      pointer-events: none;
    }
    .camera-container.paused #camera-shutter {
      opacity: 0;
      pointer-events: none;
    }

    /* Resume button overlay */
    .resume-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 15;
      background: rgba(0, 0, 0, 0.25);
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.3s ease;
    }
    .resume-overlay.hidden {
      display: none;
    }
    .resume-btn-badge {
      background: rgba(18, 18, 18, 0.85);
      border: 2px solid #00e676;
      border-radius: 50px;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      box-shadow: 0 6px 24px rgba(0, 230, 118, 0.35);
      animation: pulse-resume 2s infinite ease-in-out;
    }
    @keyframes pulse-resume {
      0%, 100% { transform: scale(1); box-shadow: 0 4px 18px rgba(0, 230, 118, 0.3); }
      50% { transform: scale(1.05); box-shadow: 0 8px 28px rgba(0, 230, 118, 0.6); }
    }

    #model-status { text-align: center; font-size: 0.9rem; color: #666; margin: 0.5rem 0; font-weight: 500; }
    #model-status.ready { color: #2a9d3e; }
    #model-status.error { color: #c0392b; }
    #zoom-wrap { display: flex; align-items: center; gap: 0.5rem; margin: 0.5rem 0; }
    #zoom-wrap.hidden { display: none; }
    #zoom-slider { flex: 1; }
    #zoom-value { min-width: 3rem; text-align: right; font-size: 0.9rem; }

    /* Lightbox Modal */
    .lightbox-modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.88);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      padding: 16px;
    }
    .lightbox-content {
      position: relative;
      max-width: 95vw;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .lightbox-content img {
      max-width: 90vw;
      max-height: 75vh;
      object-fit: contain;
      border-radius: 8px;
      background: #fff;
      padding: 8px;
    }
    .lightbox-close {
      position: absolute;
      top: -38px;
      right: -8px;
      background: none;
      border: none;
      color: #fff;
      font-size: 28px;
      cursor: pointer;
    }
    .lightbox-caption {
      color: #fff;
      margin-top: 10px;
      font-size: 14px;
      text-align: center;
      font-weight: 600;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body class="mobile-body">
  <div class="mobile-app">
    <div id="model-status" class="api-status">Загрузка детектора INT8 (WebGPU / Worker)…</div>

    <div id="zoom-wrap" class="hidden">
      <label for="zoom-slider">Зум</label>
      <input type="range" id="zoom-slider" min="0" max="1" step="0.01">
      <span id="zoom-value">1.0×</span>
    </div>

    <div id="api-warning" class="api-warning hidden">
      Не удаётся связаться с API. Проверьте MOBI_API_BASE в config.js.
    </div>

    <div class="camera-container" id="camera-wrap">
      <video id="camera-video" class="mobile-video" autoplay playsinline muted></video>
      <canvas id="freeze-canvas" class="hidden"></canvas>
      <canvas id="overlay-canvas"></canvas>
      
      <!-- Resume overlay on blurred preview -->
      <div id="resume-overlay" class="resume-overlay hidden">
        <div class="resume-btn-badge">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="#00e676">
            <path d="M8 5v14l11-7z"/>
          </svg>
          <span>Продолжить сканирование</span>
        </div>
      </div>

      <button id="camera-shutter" class="mobile-shutter" title="Сделать снимок"></button>
    </div>

    <div id="camera-status" class="mobile-status">Подключение к камере…</div>
    <div id="camera-permission" class="mobile-permission hidden"></div>

    <div id="result-section" class="hidden">
      <div id="result-status" class="mobile-status"></div>

      <div id="result-crop" class="mobile-crop-v31">
        <h3>Распознанная этикетка (нажмите для зума)</h3>
        <div style="cursor: pointer;">
          <img id="result-crop-img" alt="Кроп этикетки">
        </div>
      </div>

      <div id="hero-card" class="mobile-hero"></div>
      <div id="hero-details" class="mobile-details hidden"></div>
      <button id="details-toggle" class="btn btn-secondary hidden">Подробнее</button>

      <div id="other-results" class="mobile-others"></div>

      <button id="scan-again" class="btn mobile-search-btn" style="margin-top: 14px;">Сканировать ещё</button>
    </div>
  </div>

  <!-- Lightbox Modal -->
  <div id="lightbox-modal" class="lightbox-modal hidden" onclick="closeMobileLightbox(event)">
    <div class="lightbox-content">
      <button class="lightbox-close" onclick="closeMobileLightbox(event)">✕</button>
      <img id="lightbox-img" src="" alt="">
      <div class="lightbox-caption" id="lightbox-caption"></div>
    </div>
  </div>

  <script src="config.js?v=11"></script>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/ort.all.min.js"></script>
  <script type="module">
    import { initCascadeMobile } from './js/app_mobitest_cascade.js?v=1';
    window.addEventListener('DOMContentLoaded', () => initCascadeMobile('/export/models/yolov8_label.onnx'));
  </script>
</body>
</html>
