name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lct
          POSTGRES_PASSWORD: lct
          POSTGRES_DB: lct2026
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lct -d lct2026"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://lct:lct@localhost:5432/lct2026
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: alembic upgrade head
      - run: alembic check
      - run: ruff check .
      - run: pytest
      - run: docker build -t lct2026prod:test .
